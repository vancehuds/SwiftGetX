name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS artifacts
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Package DMG
        run: Scripts/package-dmg.sh release dist --dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SwiftGetX-dmg
          path: dist/SwiftGetX.dmg
          if-no-files-found: error

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        timeout-minutes: 15
        run: swift test

      - name: Install native packaging dependencies
        run: |
          for formula in cmake boost openssl; do
            brew list "$formula" &>/dev/null || brew list "${formula}@3" &>/dev/null || brew install "$formula"
          done

      - name: Package DMG
        run: Scripts/package-dmg.sh release dist --dmg

      - name: Package Chrome extension
        env:
          SWIFTGETX_CHROME_EXTENSION_KEY_BASE64: ${{ secrets.CHROME_EXTENSION_KEY_BASE64 }}
        run: Scripts/package-chrome-extension.sh Sources/SwiftGetX/Resources/ChromeExtension dist/chrome

      - name: Generate Sparkle appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          Scripts/generate-appcast.sh \
            dist/SwiftGetX.dmg \
            "${GITHUB_REF_NAME#v}" \
            "https://github.com/vancehuds/SwiftGetX/releases/download/${GITHUB_REF_NAME}/SwiftGetX.dmg"

      - name: Publish appcast to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or update gh-pages branch with appcast.xml
          git checkout --orphan gh-pages-tmp
          git rm -rf . 2>/dev/null || true
          cp dist/appcast/appcast.xml .
          git add appcast.xml
          git commit -m "Update appcast for ${GITHUB_REF_NAME}"

          # Force push to gh-pages branch
          git push origin HEAD:gh-pages --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SwiftGetX.dmg
            dist/chrome/SwiftGetX-Chrome.zip
            dist/chrome/SwiftGetX-Chrome.crx
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
